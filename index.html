<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>INTRO :: RETRO RADIO</title>
<meta name="theme-color" content="#0b0b17" />
<meta name="description" content="A retro-futuristic, Winamp-inspired radio player" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="crt-overlay" aria-hidden="true"></div>

<main class="player" role="application" aria-label="Retro radio player">

  <!-- Title bar -->
  <header class="titlebar">
    <span class="titlebar__logo">◆ INTRO RADIO</span>
    <span class="titlebar__clock" id="clock">00:00:00</span>
    <span class="titlebar__dots" aria-hidden="true"><i></i><i></i><i></i></span>
  </header>

  <!-- Main display -->
  <section class="display" aria-label="Now playing display">
    <div class="display__screen">
      <canvas id="visualizer" class="visualizer" width="480" height="70"></canvas>

      <div class="lcd">
        <div class="lcd__marquee">
          <span id="trackTitle">— NO SIGNAL —</span>
        </div>
        <div class="lcd__row">
          <span class="lcd__time" id="timeElapsed">00:00</span>
          <span class="lcd__mode">
            <span id="modeShuffle" class="lcd__tag">SHUF</span>
            <span id="modeRepeat" class="lcd__tag">REP</span>
            <span class="lcd__tag lcd__tag--stereo">STEREO</span>
          </span>
          <span class="lcd__time" id="timeRemaining">-00:00</span>
        </div>
      </div>
    </div>

    <!-- Seek bar -->
    <div class="seek">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek" />
    </div>
  </section>

  <!-- Transport controls -->
  <section class="transport" aria-label="Playback controls">
    <button id="btnPrev" class="btn btn--nav" title="Previous" aria-label="Previous track">⏮</button>
    <button id="btnPlay" class="btn btn--play" title="Play" aria-label="Play">▶</button>
    <button id="btnPause" class="btn btn--nav" title="Pause" aria-label="Pause">⏸</button>
    <button id="btnStop" class="btn btn--nav" title="Stop" aria-label="Stop">⏹</button>
    <button id="btnNext" class="btn btn--nav" title="Next" aria-label="Next track">⏭</button>

    <button id="btnShuffle" class="btn btn--toggle" title="Shuffle" aria-label="Toggle shuffle">🔀</button>
    <button id="btnRepeat" class="btn btn--toggle" title="Repeat" aria-label="Toggle repeat">🔁</button>

    <div class="volume">
      <span class="volume__icon" aria-hidden="true">VOL</span>
      <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume" />
    </div>
  </section>

  <!-- Playlist -->
  <section class="playlist" aria-label="Playlist">
    <div class="playlist__header">
      <span>PLAYLIST</span>
      <span id="trackCount">0 TRACKS</span>
    </div>
    <ul id="playlistItems" class="playlist__list"></ul>
  </section>

  <footer class="statusbar">
    <span id="statusText">READY.</span>
    <span class="statusbar__brand">100% CLIENT&#8209;SIDE // NO SIGNAL LOST</span>
  </footer>
</main>

<audio id="audio" preload="metadata"></audio>

<script src="js/app.js"></script>
</body>
</html>
