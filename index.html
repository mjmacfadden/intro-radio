<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>INTRO RADIO</title>
<meta name="theme-color" content="#0b0b17" />
<meta name="description" content="A retro-futuristic, Winamp-inspired radio player" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://mjmacfadden.github.io/intro-radio/" />
<meta property="og:title" content="Intro Radio" />
<meta property="og:description" content="A retro-futuristic, Winamp-inspired radio player" />
<meta property="og:image" content="https://mjmacfadden.github.io/intro-radio/intro-radio-og-image.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Intro Radio" />
<meta name="twitter:description" content="A retro-futuristic, Winamp-inspired radio player" />
<meta name="twitter:image" content="https://mjmacfadden.github.io/intro-radio/intro-radio-og-image.png" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="crt-overlay" aria-hidden="true"></div>

<main class="player" role="application" aria-label="Retro radio player">

  <!-- Title bar -->
  <header class="titlebar">
    <span class="titlebar__logo">◆ INTRO RADIO</span>
    <span class="titlebar__clock" id="clock">00:00:00</span>
    <span class="titlebar__dots" aria-hidden="true"><i></i><i></i><i></i></span>
  </header>

  <!-- Main display -->
  <section class="display" aria-label="Now playing display">
    <div class="display__screen">
      <canvas id="visualizer" class="visualizer" width="480" height="70"></canvas>

      <div class="lcd">
        <div class="lcd__marquee">
          <span id="trackTitle">— NO SIGNAL —</span>
        </div>
        <div class="lcd__row">
          <span class="lcd__time" id="timeElapsed">00:00</span>
          <span class="lcd__mode">
            <span id="modeShuffle" class="lcd__tag">SHUF</span>
            <span id="modeRepeat" class="lcd__tag">REP</span>
            <span class="lcd__tag lcd__tag--stereo">STEREO</span>
          </span>
          <span class="lcd__time" id="timeRemaining">-00:00</span>
        </div>
      </div>
    </div>

    <!-- Seek bar -->
    <div class="seek">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek" />
    </div>
  </section>

  <!-- Transport controls -->
  <section class="transport" aria-label="Playback controls">
    <div class="transport__buttons">
      <button id="btnPrev" class="btn btn--nav" title="Previous" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button id="btnPlay" class="btn btn--play" title="Play" aria-label="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="btnPause" class="btn btn--nav" title="Pause" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button id="btnStop" class="btn btn--nav" title="Stop" aria-label="Stop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>
      </button>
      <button id="btnNext" class="btn btn--nav" title="Next" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button id="btnShuffle" class="btn btn--toggle" title="Shuffle" aria-label="Toggle shuffle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17zm4.58-4.92l1.95 1.95L4 18.99 5.41 20.4 18.31 7.5l1.95 1.95V4h-5.09zm.32 8.5l-1.41 1.41 3.13 3.13-1.95 1.95H20V15h-5.09z"/></svg>
      </button>
      <button id="btnRepeat" class="btn btn--toggle" title="Repeat" aria-label="Toggle repeat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h14v-6h-2z"/></svg>
      </button>
    </div>
    <div class="transport__modes">
      <div class="volume">
        <span class="volume__icon" aria-hidden="true">VOL</span>
        <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume" />
      </div>
    </div>
  </section>

  <!-- Playlist -->
  <section class="playlist" aria-label="Playlist">
    <div class="playlist__header">
      <span>PLAYLIST</span>
      <span id="trackCount">0 TRACKS</span>
    </div>
    <ul id="playlistItems" class="playlist__list"></ul>
  </section>

  <footer class="statusbar">
    <span id="statusText">READY.</span>
    <span class="statusbar__brand">100% CLIENT&#8209;SIDE // NO SIGNAL LOST</span>
  </footer>
</main>

<audio id="audio" preload="metadata"></audio>

<script src="js/app.js"></script>
</body>
</html>
